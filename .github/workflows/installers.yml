name: Installers

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            osLabel: windows
            archLabel: amd64
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            osLabel: mac
            archLabel: silicone
          - platform: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            osLabel: mac
            archLabel: intel
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            osLabel: linux
            archLabel: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-alsa

      # The AppImage ships its own GStreamer core, so WebKitGTK audio needs the
      # plugins bundled next to it (bundleMediaFramework). Only copy the ones
      # listed, not everything installed on the runner.
      - name: Stage GStreamer plugins for the AppImage
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          dir="$RUNNER_TEMP/gstreamer-plugins"
          mkdir -p "$dir"
          sed 's/#.*//' src-tauri/appimage/gstreamer-plugins.txt | while read -r plugin _; do
            [ -z "$plugin" ] || cp "/usr/lib/x86_64-linux-gnu/gstreamer-1.0/$plugin" "$dir/"
          done
          echo "GSTREAMER_PLUGINS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$file" ]; then
            {
              echo 'body<<RELEASE_NOTES_EOF'
              cat "$file"
              echo 'RELEASE_NOTES_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'pumr v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body || 'See the assets below to download and install this version.' }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: pnpm exec tauri
          assetNamePattern: pumr-[version]-${{ matrix.osLabel }}-${{ matrix.archLabel }}[setup][ext]
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify AppImage
        if: startsWith(matrix.os, 'ubuntu')
        run: bash src-tauri/appimage/verify.sh src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
